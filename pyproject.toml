[project]
name = "agy-bridge"
version = "0.1.0"
description = "MCP server that lets Claude Code run and converse with Google Antigravity (AGY) reviewer agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "claude-code", "antigravity", "agy", "code-review", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [
    { name = "Daniel Gwerzman", email = "daniel@kulaone.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/kulaone/agy-bridge"
Issues = "https://github.com/kulaone/agy-bridge/issues"
Changelog = "https://github.com/kulaone/agy-bridge/blob/main/CHANGELOG.md"

[project.scripts]
agy-bridge = "agy_bridge:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
